name: 'TestStand Relink to PPL Action'
description: 'Relinks LabVIEW steps calling VIs of a source library to the same VIs in a PPL and saves the sequence files'

inputs:
  path:
    description: 'Directory with sequence files to relink, absolute or relative to the workspace. All *.seq files are relinked recursively.'
    required: true
  library-dir:
    description: 'Directory of the source library, relative to each sequence file'
    required: true
  ppl:
    description: 'Path to the built PPL, relative to each sequence file'
    required: true
  ppl-root-dir:
    description: 'Directory in the source tree that LabVIEW used as the root of the paths inside the PPL, relative to each sequence file. This is the common directory of all files built into the PPL. Defaults to the library directory.'
    required: false
    default: ''
  log-dir-path:
    description: 'Log output directory'
    required: false
    default: 'logs'
  fail-on-error:
    description: 'Fail build if a step could not be relinked'
    required: false
    default: true
  working-directory:
    description: 'Set working directory if not at root.'
    required: false
    default: ${{ github.workspace }}

runs:
  using: "composite"
  steps:
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
        env:
          # The default on Windows is C:\Program Files\dotnet, which the runner account cannot write to
          DOTNET_INSTALL_DIR: ${{ runner.tool_cache }}\dotnet
      - run: |
          # The CLI is shared with the analyzeSequences action.
          # Build against the interop assemblies of the active TestStand version, with the same bitness.
          # Self-contained, so the exe does not need a .NET runtime of matching bitness installed on the runner.
          $runtime = if ("$env:TestStand" -like "${env:ProgramFiles(x86)}*") { 'win-x86' } else { 'win-x64' }
          Write-Host "Building TestStandCLI for $runtime against $env:TestStand"
          dotnet publish "${{ github.action_path }}\..\analyzeSequences\TestStandCLI\TestStandCLI.csproj" `
            --configuration Release `
            --runtime $runtime `
            --self-contained true `
            --output "$env:RUNNER_TEMP\TestStandCLI" `
            --nologo `
            --verbosity quiet
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Building TestStandCLI failed with exit code $LASTEXITCODE"
            exit 1
          }
        shell: powershell
      - run: |
          # Points every LabVIEW step calling a VI below the library directory at the same VI in the PPL,
          # changes the namespace of the step from Library.lvlib to Library.lvlibp, reloads the prototype
          # keeping existing arguments, and saves the files.
          # Steps that fail to relink are reported as failures by the test reporter.
          # The TestStand engine needs absolute paths.
          $sequencePath = "${{ inputs.path }}"
          if (-not [IO.Path]::IsPathRooted($sequencePath)) {
            $sequencePath = Join-Path "${{ github.workspace }}" $sequencePath
          }
          $sequencePath = [IO.Path]::GetFullPath($sequencePath)
          $rootArgs = @()
          if ("${{ inputs.ppl-root-dir }}" -ne "") { $rootArgs = @('--ppl-root-dir', "${{ inputs.ppl-root-dir }}") }
          $reportPath = "${{ inputs.working-directory }}\${{ inputs.log-dir-path }}\RelinkToPPL.xml"
          Remove-Item -LiteralPath $reportPath -ErrorAction SilentlyContinue
          & "$env:RUNNER_TEMP\TestStandCLI\TestStandCLI.exe" relink-to-ppl $sequencePath --library-dir "${{ inputs.library-dir }}" --ppl "${{ inputs.ppl }}" $rootArgs --junit-report $reportPath
          if (-not (Test-Path -LiteralPath $reportPath)) {
            Write-Error "Relinking to PPL failed with exit code $LASTEXITCODE"
            exit 1
          }
          exit 0
        shell: powershell
      - name: Publish Relink to PPL Report
        uses: astemes/test-reporter@v2
        if: ${{ !cancelled() }}
        with:
          name: TestStand Relink to PPL
          path: ${{ inputs.log-dir-path }}/RelinkToPPL.xml
          reporter: java-junit
          fail-on-error: ${{ inputs.fail-on-error }}
          list-suites: 'failed'
          working-directory: ${{ inputs.working-directory }}
