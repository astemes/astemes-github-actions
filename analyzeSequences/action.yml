name: 'TestStand Sequence Analyzer Action'
description: 'Runs the TestStand Sequence Analyzer on all sequence files in a directory'

inputs:
  path:
    description: 'Directory to analyze. All *.seq files are analyzed recursively.'
    required: true
  log-dir-path:
    description: 'Log output directory'
    required: false
    default: 'logs'
  fail-on-error:
    description: 'Fail build on Sequence Analyzer errors'
    required: false
    default: true
  working-directory:
    description: 'Set working directory if not at root.'
    required: false
    default: ${{ github.workspace }}

runs:
  using: "composite"
  steps:
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
        env:
          # The default on Windows is C:\Program Files\dotnet, which the runner account cannot write to
          DOTNET_INSTALL_DIR: ${{ runner.tool_cache }}\dotnet
      - run: |
          # Build against the interop assemblies of the active TestStand version, with the same bitness.
          # Self-contained, so the exe does not need a .NET runtime of matching bitness installed on the runner.
          $runtime = if ("$env:TestStand" -like "${env:ProgramFiles(x86)}*") { 'win-x86' } else { 'win-x64' }
          Write-Host "Building TestStandCLI for $runtime against $env:TestStand"
          dotnet publish "${{ github.action_path }}\TestStandCLI\TestStandCLI.csproj" `
            --configuration Release `
            --runtime $runtime `
            --self-contained true `
            --output "$env:RUNNER_TEMP\TestStandCLI" `
            --nologo `
            --verbosity quiet
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Building TestStandCLI failed with exit code $LASTEXITCODE"
            exit 1
          }
        shell: powershell
      - run: |
          # TestStandCLI exits with 1 when the analyzer reports errors, which is reported by the test reporter.
          # Errors are reported as failures and warnings as skipped tests.
          # The TestStand engine needs absolute paths.
          $sequencePath = [IO.Path]::GetFullPath("${{ github.workspace }}\${{ inputs.path }}")
          $reportPath = "${{ inputs.working-directory }}\${{ inputs.log-dir-path }}\SequenceAnalyzer.xml"
          Remove-Item -LiteralPath $reportPath -ErrorAction SilentlyContinue
          & "$env:RUNNER_TEMP\TestStandCLI\TestStandCLI.exe" analyze $sequencePath --junit-report $reportPath
          if (-not (Test-Path -LiteralPath $reportPath)) {
            Write-Error "TestStand Sequence Analyzer failed with exit code $LASTEXITCODE"
            exit 1
          }
          exit 0
        shell: powershell
      - name: Publish Sequence Analyzer Report
        uses: astemes/test-reporter@v2
        if: ${{ !cancelled() }}
        with:
          name: TestStand Sequence Analyzer
          path: ${{ inputs.log-dir-path }}/SequenceAnalyzer.xml
          reporter: java-junit
          fail-on-error: ${{ inputs.fail-on-error }}
          list-suites: 'failed'
          working-directory: ${{ inputs.working-directory }}
